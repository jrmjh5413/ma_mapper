name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pybedtools calls the bedtools binary, which is not a Python dependency.
      # Where it is missing the tests that need it are skipped, not failed.
      - name: Install bedtools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bedtools

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check ma_mapper tests

      - name: Tests
        run: pytest -q

      # Coverage follows the VCF and MAF worker processes, which triples the
      # runtime, so it runs once rather than in every matrix entry.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=60

      - name: The command line runs
        run: |
          ma-mapper --version
          ma-mapper info

  # "Freely available ... without significant investment of time to install" is
  # a claim the paper makes, so it is checked on every push rather than once by
  # hand: build both distributions, install the wheel into an environment that
  # holds nothing else, and run the shipped example, which checks its own output.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: The sdist must carry the docs, examples and tests
        run: |
          tar tzf dist/*.tar.gz | grep -q "docs/package_docs.md"
          tar tzf dist/*.tar.gz | grep -q "examples/toy_end_to_end.py"
          tar tzf dist/*.tar.gz | grep -q "tests/conftest.py"

      - name: Install the wheel into an empty environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/ma-mapper --version
          /tmp/clean/bin/ma-mapper info
          /tmp/clean/bin/python examples/toy_end_to_end.py /tmp/clean_check

      - name: The example must have produced a matrix and its run record
        run: |
          test -s /tmp/clean_check/matrix.npy
          test -s /tmp/clean_check/matrix.rows.tsv
